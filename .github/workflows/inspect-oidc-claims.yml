# Throwaway workflow. Prints the real `sub` claim GitHub puts in the OIDC token,
# so the trust policies in infra/bootstrap/roles.tf can be checked against
# reality instead of against a guess. Delete once the values are confirmed.
#
# Confirmed on run #1: ref:refs/heads/main and environment:prod both match the
# trust policies. This PR exists to confirm the third one, pull_request.
#
# Only `sub`, `aud` and a few non-sensitive claims are printed. The token itself
# is a credential and this repository is public, so it never reaches the log.
name: inspect-oidc-claims

on:
  workflow_dispatch: # run by hand -> shows the ref:refs/heads/... subject
  pull_request: # opening a PR   -> shows the pull_request subject

permissions:
  id-token: write # required to request the token at all
  contents: read

jobs:
  # Subject for a plain run: ref:refs/heads/<branch> or pull_request.
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Print claims
        run: |
          set -euo pipefail

          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)

          # A JWT is header.payload.signature, base64url encoded. Take the
          # payload, translate base64url to base64, restore the padding.
          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac

          # Only these fields. Never echo "$token".
          echo "$payload" | base64 -d \
            | jq '{sub, aud, event_name, ref, repository, repository_id, repository_owner_id}'

  # Subject when the job declares an environment. Note it drops the ref.
  # If this job fails because the environment does not exist, create it under
  # Settings > Environments, or just ignore it for now.
  with-environment:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Print claims
        run: |
          set -euo pipefail

          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)

          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac

          echo "$payload" | base64 -d | jq '{sub, aud, environment}'
